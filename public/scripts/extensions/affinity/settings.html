<div id="affinity_settings" class="affinity_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>💕 好感度记忆</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <p class="affinity_tagline">角色会记住你们之间发生过的事。</p>
            <p class="affinity_desc">说过的约定、表达的信任、一起经历的转折——这些不会被下一次对话冲掉。每隔几轮回复，角色会在后台安静地整理记忆，然后在未来的对话里自然地想起。</p>
            <label class="checkbox_label"><input id="affinity_enabled" type="checkbox">启用好感度记忆</label>
            <label for="affinity_interval">整理频率</label>
            <select id="affinity_interval" class="text_pole">
                <option value="10">每 10 条回复整理一次</option>
                <option value="5">每 5 条回复整理一次</option>
            </select>
            <small>后台整理会额外使用少量额度。记忆只存在当前聊天里，不会跨聊天泄露。独立于命运之笔运行。</small>
        </div>
    </div>
</div>
