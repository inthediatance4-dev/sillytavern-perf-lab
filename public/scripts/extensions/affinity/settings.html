<div id="affinity_settings" class="affinity_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>💕 好感度记忆</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label class="checkbox_label"><input id="affinity_enabled" type="checkbox">启用好感度记忆</label>
            <label for="affinity_interval">整理频率</label>
            <select id="affinity_interval" class="text_pole">
                <option value="10">每 10 条有效回复</option>
                <option value="5">每 5 条有效回复</option>
            </select>
            <small>记住相处中的事实与约定，尊重角色边界。后台整理会额外使用少量额度。独立于命运之笔运行。</small>
        </div>
    </div>
</div>
