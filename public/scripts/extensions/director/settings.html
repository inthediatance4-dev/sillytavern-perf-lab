<div id="director_settings" class="director_settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>🎬 Director</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <p>点击输入框左侧的 🎬 选择预设。弹出菜单获得焦点时可按 1–9，Esc 关闭。</p>
            <label for="director_hotkey">快捷键（默认关闭）</label>
            <input id="director_hotkey" class="text_pole" type="text" placeholder="Ctrl+Shift+D" autocomplete="off">
            <small>留空关闭。输入文字时不触发快捷键。预设输入可留空；取消对话框不会插入内容。</small>
        </div>
    </div>
</div>
